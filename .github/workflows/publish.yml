name: Publish to PowerShell Gallery

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish Module
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release with Copilot-generated notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release for $tag already exists. Skipping creation."
          }
          else {
            gh release create $tag --title "$tag" --generate-notes --verify-tag
          }

      - name: Publish to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          $stagingPath = Join-Path $env:RUNNER_TEMP "psgallery-publish"
          $modulePath = Join-Path $stagingPath "UtilModule"

          New-Item -Path $modulePath -ItemType Directory -Force | Out-Null
          Copy-Item -Path ./UtilModule.psd1 -Destination $modulePath -Force
          Copy-Item -Path ./UtilModule.psm1 -Destination $modulePath -Force
          Copy-Item -Path ./Functions -Destination $modulePath -Recurse -Force

          $version = (Import-PowerShellDataFile ./UtilModule.psd1).ModuleVersion
          Write-Host "Publishing UtilModule v$version"
          Publish-Module -Path $modulePath -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
